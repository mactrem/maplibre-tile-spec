[package]
name = "mlt-wasm"
description = "WebAssembly bindings for the MapLibre Tile (MLT) format"
version = "0.2.3"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory"]

[lib]
crate-type = ["cdylib"]

[features]
# Export `annotateTile`, for tooling that shows the wire format
annotate = ["dep:serde", "dep:serde-wasm-bindgen"]
# Export the recorded LLVM coverage counters, for `just rust::wasm-coverage`
coverage = ["dep:minicov"]
default = ["annotate", "geojson", "unstable-v2"]
# Export `tileGeoJson`
geojson = ["dep:serde_json"]
# Decode v2 layers in `decodeTileColumns`, which otherwise skips them
unstable-v2 = []

[dependencies]
js-sys.workspace = true
minicov = { workspace = true, optional = true }
mlt-core = { workspace = true, features = ["unstable-v2"] }
serde = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wasm-bindgen.workspace = true

[lints]
workspace = true
